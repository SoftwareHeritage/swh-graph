[workspace]

resolver = "2"

members = [
    "pyo3",
    "rust",
    "grpc-server",
    "tools/counters",
    "tools/subgrapher",
]

[workspace.package]
repository = "https://gitlab.softwareheritage.org/swh/devel/swh-graph"
license = "GPL-3.0-or-later"
version = "13.0.0"

[workspace.dependencies]
swh-graph = { version = "13.0.0", path = "./rust/" }

anyhow = { version="1.0.79", features=["backtrace"] }
dsi-bitstream = "0.10.1"
epserde = "0.13.2"
itertools = { version = "0.11.0" }
fallible-iterator = "0.3.0"
lender = "0.8.0"
mmap-rs = "0.7.0"
rayon = { version = "1.9.0" }
webgraph = "0.7.0"
webgraph-algo = "0.7.0"
webgraph-cli = "0.5.0"
sux = "0.15.2"
value-traits = "0.3.1"

# CLI
env_logger = "0.11.5"
clap = { version = "4.1.6", features = ["derive"] }
dsi-progress-logger = "0.8.0"
log = "0.4.17"


[profile.release]
lto = "fat"               # Full LTO
debug = "limited"         # Include profiling info.
codegen-units=1           # slower compile times, but maybe better perf
